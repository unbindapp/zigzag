# Monorepo hooks, run with prek (https://github.com/j178/prek) or pre-commit. Each
# app's hooks are scoped via `files:` so they only run when that app changes, and
# `cd` into the app so module-relative tools (go.mod, eslint/prettier config) resolve.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: end-of-file-fixer
        exclude: ^(apps/web/src/lib/server/client\.gen\.ts|.*/testdata/.*)$

  - repo: local
    hooks:
      # --- apps/api ---
      - id: api-go-mod-tidy
        name: "api: go mod tidy"
        entry: bash -c 'cd apps/api && go mod tidy'
        language: system
        files: ^apps/api/.*\.(go|mod|sum)$
        pass_filenames: false
      - id: api-gofmt
        name: "api: gofmt -s"
        entry: bash -c 'cd apps/api && out=$(gofmt -s -l .) && [ -z "$out" ] || { echo "$out"; exit 1; }'
        language: system
        files: ^apps/api/.*\.go$
        pass_filenames: false
      - id: api-golangci-lint
        name: "api: golangci-lint"
        entry: bash -c 'cd apps/api && go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0 run'
        language: system
        files: ^apps/api/.*\.go$
        pass_filenames: false
      - id: api-web-types
        name: "api: web client types in sync"
        entry: bash -c '[ -d apps/web/node_modules ] || { echo "apps/web/node_modules missing, skipping"; exit 0; }; ./scripts/check-web-types.sh'
        language: system
        files: ^apps/api/.*\.go$
        pass_filenames: false

      # --- apps/web (staged files only; paths are repo-relative so strip the
      #     apps/web/ prefix before running from inside apps/web) ---
      - id: web-eslint
        name: "web: eslint"
        entry: bash -c 'cd apps/web && exec npx --no-install eslint "${@#apps/web/}"' --
        language: system
        files: ^apps/web/.*\.(t|j)sx?$
        exclude: ^apps/web/src/(lib/server/client|routeTree)\.gen\.ts$
        pass_filenames: true
      - id: web-prettier
        name: "web: prettier --check"
        entry: bash -c 'cd apps/web && exec npx --no-install prettier --check --ignore-unknown "${@#apps/web/}"' --
        language: system
        files: ^apps/web/.*\.(tsx?|jsx?|css|json|md)$
        pass_filenames: true
      - id: web-ui-consistency
        name: "web: ui consistency"
        entry: bash -c 'cd apps/web && node scripts/check-ui-consistency.mjs'
        language: system
        files: ^apps/web/src/.*\.tsx?$
        pass_filenames: false
      # typecheck needs the gitignored src/routeTree.gen.ts, generated by `npm run dev`/`build`.
      - id: web-typecheck
        name: "web: tsc --noEmit"
        entry: bash -c 'cd apps/web && exec npx --no-install tsc --noEmit'
        language: system
        files: ^apps/web/(.*\.(t|j)sx?|tsconfig\.json)$
        pass_filenames: false
